<style>
.todayPage{max-width:1080px;margin:0 auto;padding:0 24px 80px}
.tTop{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;margin:0 -24px;padding:12px 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.tTop a{color:var(--dim);text-decoration:none;font-size:.86rem}
.tTop a:hover{color:var(--text)}

.tHero h1{font-family:var(--serif);font-weight:700;font-size:clamp(2rem,5vw,3.2rem);margin:0 0 12px;color:var(--text)}
.tHero h1 em{font-style:normal;color:var(--accent)}
.tHero p{color:var(--dim);max-width:640px;margin:0;line-height:1.8}
.tBar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.tBar .chip{font-family:var(--mono);font-size:.78rem;padding:7px 14px;border:1px solid var(--line2);border-radius:20px;background:none;color:var(--dim);cursor:pointer}
.tBar .chip.on{border-color:var(--accent);color:var(--accent)}

.dayCell:hover{border-color:var(--accent)}

.dayCell .dn{font-family:var(--mono);font-size:.86rem;color:var(--text)}
.dayCell .dc{font-family:var(--mono);font-size:.62rem;color:var(--faint);margin-top:2px}
.dayCell.c1 .dc{color:var(--dim)}
.dayCell.c2 .dc{color:var(--accent)}
.dayCell.c3 .dc{color:var(--accent);font-weight:700}
.dayEmpty{opacity:.35;cursor:default}
.dayHead{display:flex;align-items:baseline;gap:14px;padding:22px 0 6px;flex-wrap:wrap}
.dayHead h2{font-family:var(--serif);font-size:1.5rem;color:var(--text);margin:0}
.dayHead .cnt{font-family:var(--mono);font-size:.75rem;color:var(--faint)}

.evItem .sm{color:var(--dim);font-size:.85rem;line-height:1.7;margin:6px 0 0}
.evItem .meta{margin-top:8px;font-family:var(--mono);font-size:.68rem;color:var(--faint)}
</style>
</head>
<body>
<div class="todayPage">
  <div class="tTop"><a href="../">← 返回互联网编年史</a><span><a href="../entities/">世家志 →</a>&nbsp;&nbsp;<a href="../persons/">人物志 →</a>&nbsp;&nbsp;<a href="../works/">作品志 →</a></span></div>
  <div class="tHero">
    <h1>历史上的<em>今天</em></h1>
    <p id="heroSub">这部编年史精确到日——于是每一个「月日」都攒下了一叠年份不同的记忆。选一个日子，看看历史上的那一天都发生过什么。</p>
  </div>
  <div class="tBar" id="monthBar"></div>
  <div class="dayGrid" id="dayGrid"></div>
  <div class="dayHead"><h2 id="dayTitle">—</h2><span class="cnt" id="dayCnt"></span><button class="chip" id="copyLink" style="margin-left:auto">🔗 复制链接</button></div>
  <div class="evList" id="evList"></div>
</div>
<div class="pMask" id="mask"></div>
<div class="pDetail" id="detail"></div>
<style>
.pMask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none}
.pMask.show{display:block}
.pDetail{position:fixed;top:0;right:-720px;width:min(680px,94vw);height:100vh;overflow-y:auto;background:var(--bg2);border-left:1px solid var(--line2);z-index:61;padding:30px 34px 60px;transition:right .25s ease}
.pDetail.show{right:0}
.pDetail h2{font-family:var(--serif);font-size:1.55rem;color:var(--text);margin:0 0 4px;line-height:1.4}
.pDetail .close{position:absolute;top:18px;right:20px;font-size:1.3rem;background:none;border:none;color:var(--dim);cursor:pointer}
.pDetail .sub{color:var(--accent);font-size:.85rem;margin-bottom:16px;font-family:var(--mono)}
.pDetail .smFull{color:var(--text);line-height:1.85;font-size:.94rem}
.pDetail h4{font-family:var(--mono);font-size:.76rem;letter-spacing:.2em;color:var(--dim);margin:24px 0 12px}
.sec{margin-bottom:14px}
.sec .lab{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.28em;color:var(--faint);margin-bottom:4px}
.sec p{margin:0;font-size:.9rem;line-height:1.8;color:var(--text)}
.srcList{margin:4px 0 0;padding-left:18px;font-size:.85rem;line-height:2}
.srcList a{color:var(--accent);text-decoration:none}
.evItem{cursor:pointer}
.evItem:hover{border-color:var(--accent)}
.loading{color:var(--faint);font-family:var(--mono);font-size:.8rem}
</style>

<script src="../common.js?v=3"></script>
<script>
'use strict';
/* 抽屉与日期网格为本页特有；工具函数（esc/safeUrl/fetchGz）全部复用 NA */
const { esc, safeUrl, DATA_BUILD, fetchGz } = NA;
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const $ = s => document.querySelector(s);
let META = null, curMonth = null, curDay = null;
/* 数据分两层（2026-10-26 手机端提速）：meta（总量/月度计数，约 200B）随页取；
   月度明细按需懒取（约 70-110KB gz/月）。旧整包 data.json 仍在（旧缓存页与
   无 DecompressionStream 环境兜底），页面首屏不再加载它 */
const MCACHE = {};                                   // m -> Promise<days>（缓存进行中的请求，杜绝并发重复下载）
async function ensureMonth(m) {
  if (!MCACHE[m]) {
    MCACHE[m] = fetchGz('data/m' + pad(m) + '.json')
      .then(d => d.days)
      .catch(() => { delete MCACHE[m]; return {}; });   // 失败出缓存，下次点击可重试
  }
  return MCACHE[m];
}

function pad(n) { return String(n).padStart(2, '0'); }

function renderMonths() {
  const bar = $('#monthBar');
  bar.innerHTML = '';
  for (let m = 1; m <= 12; m++) {
    const b = document.createElement('button');
    b.className = 'chip' + (curMonth === m ? ' on' : '');
    b.textContent = `${MONTHS[m - 1]} ${META.months[pad(m)] || 0}`;
    b.onclick = () => { curMonth = m; const keep = curDay; renderMonths(); renderDays(); if (keep && String(keep).startsWith(pad(m) + '-')) selectDay(keep); };
    bar.appendChild(b);
  }
  const r = document.createElement('button');
  r.className = 'chip rnd';
  r.textContent = '🎲 随机一天';
  r.onclick = randomDay;
  bar.appendChild(r);
}

let _rdToken = 0;
async function renderDays() {
  const my = ++_rdToken;
  const days = await ensureMonth(curMonth);
  if (my !== _rdToken) return;                       // 月份已切换，丢弃过期渲染
  const grid = $('#dayGrid');
  grid.innerHTML = '';
  const dim = new Date(2024, curMonth, 0).getDate();
  const counts = [];
  for (let d = 1; d <= dim; d++) {
    const n = (days[pad(curMonth) + '-' + pad(d)] || []).length;
    counts.push(n);
  }
  const max = Math.max(...counts, 1);
  for (let d = 1; d <= dim; d++) {
    const key = pad(curMonth) + '-' + pad(d);
    const n = counts[d - 1];
    const cell = document.createElement('div');
    cell.className = 'dayCell' + (n === 0 ? ' dayEmpty' : n >= max * 0.66 ? ' c3' : n >= max * 0.33 ? ' c2' : ' c1') + (key === curDay ? ' on' : '');
    cell.innerHTML = `<div class="dn">${d}日</div><div class="dc">${n ? n + ' 条' : '—'}</div>`;
    if (n) cell.onclick = () => selectDay(key);
    grid.appendChild(cell);
  }
}

let _sdToken = 0;
async function selectDay(key) {
  const my = ++_sdToken;                             // 连点不同日：只让最后一次生效
  const days = await ensureMonth(parseInt(key.slice(0, 2), 10));
  if (my !== _sdToken) return;
  curDay = key;
  history.replaceState(null, '', '?d=' + key);
  const [m, d] = key.split('-').map(Number);
  const evs = days[key] || [];
  $('#dayTitle').textContent = `${m} 月 ${d} 日`;
  const years = evs.map(e => e.date.slice(0, 4));
  $('#dayCnt').textContent = evs.length ? `${evs.length} 条 · ${years[0]} — ${years[years.length - 1]}` : '无记录';
  const list = $('#evList');
  list.innerHTML = '';
  for (const e of evs) {
    const div = document.createElement('div');
    div.className = 'evItem';
    div.innerHTML = `<div class="row"><span class="yr">${e.date.slice(0, 4)}</span><span class="ti">${esc(e.title)}</span>${e.milestone ? '<span class="star">★ 时代转折点</span>' : ''}</div>
      ${e.summary ? `<p class="sm">${esc(e.summary.slice(0, 110))}${e.summary.length > 110 ? '…' : ''}</p>` : ''}
      <div class="meta">${esc(e.layer)}${e.milestone ? ' · ★' : ''}</div>`;
    div.onclick = () => openEv(e, div);
    list.appendChild(div);
  }
  gridSync();
}

/* 点卡片 → 右侧抽屉：先展示今日已有信息，再懒拉主时间线全文 */
let _shardCache = {};
async function fetchFull(id, date) {
  const eraIdx = [
    ['1972', 1994.4], ['1994', 2000], ['2000', 2003], ['2003', 2005],
    ['2005', 2010], ['2010', 2015], ['2015', 2020], ['2020', 2027],
  ].findIndex(([a, b]) => {
    const yf = +date.slice(0, 4) + (+date.slice(5, 7) - 1) / 12;
    return yf >= +a && yf < b;
  });
  const i = eraIdx === -1 ? 7 : eraIdx;
  if (!_shardCache[i]) {
    const r = await fetch('../data/shard-' + i + '.json.gz?v=' + DATA_BUILD);
    if (r.ok) {
      if ((r.headers.get('content-encoding') || '').includes('gzip')) {
        _shardCache[i] = await r.json();          // 服务器已解压过，直接 json()
      } else {
        const buf = await r.arrayBuffer();
        const ds = new DecompressionStream('gzip');
        const stream = new Blob([buf]).stream().pipeThrough(ds);
        _shardCache[i] = await new Response(stream).json();
      }
    } else {
      _shardCache[i] = [];
    }
  }
  return (_shardCache[i] || []).find(x => x.id === id);
}
function openEv(e, divEl) {
  const mask = document.getElementById('mask');
  const det = document.getElementById('detail');
  const [y, m, d] = e.date.split('-');
  det.innerHTML = `<button class="close">✕</button>
    <h2>${esc(e.title)}</h2>
    <div class="sub">${y}.${m}.${d} · ${esc(e.layer)}${e.milestone ? ' · ★ 时代转折点' : ''}</div>
    <p class="smFull">${esc(e.summary || '')}</p>
    <div class="loading">正在载入完整经过…</div>`;
  det.classList.add('show');
  mask.classList.add('show');
  document.body.style.overflow = 'hidden';
  det.querySelector('.close').onclick = closeEv;
  mask.onclick = closeEv;
  fetchFull(e.id, e.date).then(full => {
    const box = det.querySelector('.loading');
    if (!box) return;
    if (!full) { box.textContent = '未找到更详细的档案。'; return; }
    box.remove();
    const secs = [];
    if (full.detail) secs.push(['经过', full.detail]);
    if (full.impact) secs.push(['影响', full.impact]);
    if (full.aftermath) secs.push(['后续', full.aftermath]);
    const srcHtml = (full.sources || []).length
      ? `<h4>来源</h4><ul class="srcList">${full.sources.map(s => `<li><a href="${safeUrl(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('')}</ul>` : '';
    det.querySelector('.smFull').insertAdjacentHTML('afterend',
      secs.map(([lab, txt]) => `<div class="sec"><span class="lab">${lab}</span><p>${esc(txt)}</p></div>`).join('') + srcHtml);
  }).catch(() => {
    const box = det.querySelector('.loading');
    if (box) box.textContent = '详细档案载入失败。';
  });
}
function closeEv() {
  document.getElementById('detail').classList.remove('show');
  document.getElementById('mask').classList.remove('show');
  document.body.style.overflow = '';
}

function gridSync() {
  document.querySelectorAll('.dayCell').forEach(c => {
    const dn = c.querySelector('.dn').textContent;
    c.classList.toggle('on', curDay === pad(curMonth) + '-' + pad(parseInt(dn)));
  });
}

async function randomDay() {
  /* 原版在全部日子里等概率抽一天；分片后按各月天数加权选月，再在月内等概率选日，
     全程只拉一个月份的分片 */
  const entries = Object.entries(META.monthDays).filter(([, n]) => n > 0);
  if (!entries.length) return;
  const totalDays = entries.reduce((s, [, n]) => s + n, 0);
  let r = Math.random() * totalDays, m = entries[entries.length - 1][0];
  for (const [mm, n] of entries) { r -= n; if (r < 0) { m = mm; break; } }
  const days = await ensureMonth(+m);
  const keys = Object.keys(days);
  if (!keys.length) return;
  const key = keys[Math.floor(Math.random() * keys.length)];
  if (+m !== curMonth) { curMonth = +m; renderMonths(); renderDays(); }
  selectDay(key);
  window.scrollTo({ top: $('.dayHead').offsetTop - 90, behavior: 'smooth' });
}

(async () => {
  try {
    META = await fetchGz('data/meta.json');
    const now = new Date();
    curMonth = now.getMonth() + 1;
    $('#heroSub').textContent = `${META.count} 条记录覆盖 ${META.dayCount} 个日子（1972—2026，精确到日）——每一个「月日」都攒下了一叠年份不同的记忆。选一个日子，看看历史上那一天发生过什么。`;
    renderMonths();
    renderDays();
    $('#copyLink').onclick = () => {
      const done = () => {
        $('#copyLink').textContent = '✓ 已复制';
        setTimeout(() => { $('#copyLink').textContent = '🔗 复制链接'; }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(location.href).then(done).catch(() => {
          $('#copyLink').textContent = '复制失败，请手动复制地址栏';
          setTimeout(() => { $('#copyLink').textContent = '🔗 复制链接'; }, 1600);
        });
      } else {
        $('#copyLink').textContent = '请手动复制地址栏链接';
        setTimeout(() => { $('#copyLink').textContent = '🔗 复制链接'; }, 1600);
      }
    };
    const qd = new URLSearchParams(location.search).get('d');
    if (qd && /^\d{2}-\d{2}$/.test(qd) && (await ensureMonth(parseInt(qd.slice(0, 2), 10)))[qd]) {
      curMonth = parseInt(qd.slice(0, 2));
      renderMonths();
      renderDays();
      selectDay(qd);
    } else {
      selectDay(pad(curMonth) + '-' + pad(now.getDate()));
    }
  } catch (e) {
    $('#evList').innerHTML = `<div class="evItem">数据加载失败（${e.message}）</div>`;
  }
})();
</script>
</body>
