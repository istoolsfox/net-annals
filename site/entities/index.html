<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="世家志：企业、社区、机构的完整兴衰史——从创立到巅峰到谢幕，节点全部可溯源。对应《史记》五体中的「世家」。">
<link rel="canonical" href="https://toolsfox.cn/entities/">
<meta property="og:type" content="website">
<meta property="og:title" content="世家志 · 企业社区机构兴衰史 — 互联网编年史">
<meta property="og:description" content="腾讯的天涯的猫扑的，你们的青春都在这里立了传——企业、社区、机构的完整兴衰史，从创立到巅峰到谢幕。">
<meta property="og:url" content="https://toolsfox.cn/entities/">
<meta property="og:image" content="https://toolsfox.cn/assets/og-card.png">
<meta name="twitter:card" content="summary_large_image">
<title>世家志 · 企业社区机构兴衰史</title>
<link rel="stylesheet" href="../style.css?v=19">
<script>
(function () {
  var t = localStorage.getItem('na-theme');
  if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
.entitiesPage{max-width:1160px;margin:0 auto;padding:0 24px 80px}
.eTop{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.eTop a{color:var(--dim);text-decoration:none;font-size:.86rem}
.eTop a:hover{color:var(--text)}
.eHero{padding:30px 0 26px;border-bottom:1px solid var(--line)}
.eHero h1{font-family:var(--serif);font-weight:700;font-size:clamp(2rem,5vw,3.2rem);margin:0 0 12px;color:var(--text)}
.eHero h1 em{font-style:normal;color:var(--accent)}
.eHero p{color:var(--dim);max-width:640px;margin:0;line-height:1.8}
.eBar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.eBar .chip{font-family:var(--mono);font-size:.78rem;padding:7px 14px;border:1px solid var(--line2);border-radius:20px;background:none;color:var(--dim);cursor:pointer}
.eBar .chip.on{border-color:var(--accent);color:var(--accent)}
#q{margin-left:auto;font-family:var(--mono);font-size:.78rem;padding:7px 14px;border:1px solid var(--line2);border-radius:20px;background:none;color:var(--text);outline:none;min-width:180px}
/* 时间线形态：复用主长卷骨架 */
.eCard{max-width:calc(50% - 34px)}
.eCard .cTitle a{cursor:pointer}
.eCard .hl{color:var(--accent);font-size:.82rem;margin:4px 0 8px}
.eCard .sm{color:var(--dim);font-size:.85rem;line-height:1.7;margin:0}
.eCard .meta{margin-top:10px;font-family:var(--mono);font-size:.7rem;color:var(--faint)}
.eCard .st{font-family:var(--mono);font-size:.66rem;padding:1px 8px;border-radius:4px;border:1px solid var(--line2)}
.st.active{color:#7ba05b;border-color:color-mix(in srgb,#7ba05b 50%, var(--line))}
.st.declined{color:#b8862b;border-color:color-mix(in srgb,#b8862b 50%, var(--line))}
.st.acquired,.st.privatized{color:#7a7ab8;border-color:color-mix(in srgb,#7a7ab8 50%, var(--line))}
.st.closed{color:#b85450;border-color:color-mix(in srgb,#b85450 50%, var(--line))}
/* 详情浮层 */
.eMask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none}
.eMask.show{display:block}
.eDetail{position:fixed;top:0;right:-720px;width:min(680px,94vw);height:100vh;overflow-y:auto;
  background:var(--bg2);border-left:1px solid var(--line2);z-index:61;padding:30px 34px 60px;
  transition:right .25s ease}
.eDetail.show{right:0}
.eDetail h2{font-family:var(--serif);font-size:1.7rem;color:var(--text);margin:0 0 4px}
.eDetail .close{position:absolute;top:18px;right:20px;font-size:1.3rem;background:none;border:none;color:var(--dim);cursor:pointer}
.eDetail .close:hover{color:var(--text)}
.eDetail .sub{color:var(--accent);font-size:.85rem;margin-bottom:16px}
.eDetail .smFull{color:var(--text);line-height:1.85;font-size:.94rem}
.eDetail h4{font-family:var(--mono);font-size:.76rem;letter-spacing:.2em;color:var(--dim);margin:28px 0 14px;text-transform:uppercase}
.tl{border-left:2px solid var(--line2);margin-left:6px;padding-left:20px}
.tlItem{position:relative;padding-bottom:18px}
.tlItem::before{content:'';position:absolute;left:-25px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tlItem .td{font-family:var(--mono);font-size:.72rem;color:var(--accent)}
.tlItem .tx{color:var(--text);font-size:.9rem;line-height:1.75;margin-top:2px}
.msList{margin:0;padding-left:18px;color:var(--text);font-size:.9rem;line-height:2}
.srcList{margin:0;padding-left:18px;font-size:.83rem;line-height:2}
.srcList a{color:var(--accent);text-decoration:none}
.srcList a:hover{text-decoration:underline}
.legacyBox{border-left:3px solid var(--accent);padding:12px 16px;background:var(--panel);border-radius:0 8px 8px 0;color:var(--text);line-height:1.8;font-size:.9rem}
.ctzBox{border-left:3px solid #b8862b;padding:10px 14px;margin-top:10px;color:var(--dim);line-height:1.7;font-size:.85rem;background:var(--panel);border-radius:0 8px 8px 0}
.relRow{display:flex;gap:8px;flex-wrap:wrap}
.relChip{font-family:var(--mono);font-size:.74rem;padding:5px 12px;border:1px solid var(--line2);border-radius:16px;color:var(--accent);text-decoration:none}
.relChip:hover{border-color:var(--accent);background:var(--panel)}
.empty{text-align:center;color:var(--faint);font-family:var(--mono);font-size:.8rem;padding:30px}
@media (max-width:640px){.eDetail{padding:24px 20px 50px}#q{min-width:140px}}
</style>
</head>
<body>
<div class="entitiesPage">
  <div class="eTop"><a href="../">← 返回互联网编年史</a><span><a href="../works/">作品志 →</a>&nbsp;&nbsp;<a href="../today/">今天 →</a></span></div>
  <div class="eHero">
    <h1>世家<em>志</em></h1>
    <p id="heroSub">企业、社区、机构的完整兴衰史，从创立到巅峰到谢幕，每个节点精确可溯源。</p>
  </div>
  <div class="eBar">
    <button class="chip on" data-f="all" id="allBtn">全部</button>
    <span id="typeChips" style="display:contents"></span>
    <input id="q" placeholder="搜索世家 / 总部…" autocomplete="off">
  </div>
  <div id="etimeline" class="timeline"></div>
</div>
<div class="eMask" id="mask"></div>
<div class="eDetail" id="detail"></div>

<script>
'use strict';
const TYPES = {company:'企业', community:'社区', media:'媒体', service:'服务', infrastructure:'基础设施', organization:'机构', game:'游戏'};
const STATUS = {active:'活跃', declined:'衰落', acquired:'被收购', privatized:'已退市', closed:'关停'};
const REGION = {cn:'中国', world:'世界'};
/* 创立年份分卷：与主长卷同款「时代 → 年份组 → 卡片」三段式 */
const ERAS = [
  { name: '奠基纪元', range: [-Infinity, 1990] },
  { name: '拨号纪元', range: [1990, 1999] },
  { name: '门户纪元', range: [1999, 2005] },
  { name: 'Web2.0 纪元', range: [2005, 2011] },
  { name: '移动纪元', range: [2011, 2016] },
  { name: '智能纪元', range: [2016, Infinity] },
];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
let DATA = null, curFilter = 'all', curQuery = '';
const DATA_BUILD = '20261024a';

async function fetchGz(url) {
  if (typeof DecompressionStream !== 'undefined') {
    try {
      const r = await fetch(url + '.gz?v=' + DATA_BUILD);
      if (r.ok) return await new Response((await r.blob()).stream().pipeThrough(new DecompressionStream('gzip'))).json();
    } catch (e) { /* 回退 */ }
  }
  return await (await fetch(url + '?v=' + DATA_BUILD)).json();
}

const eraIdx = y => ERAS.findIndex(e => y >= e.range[0] && y < e.range[1]);
const byY = e => String(e.founded || '0000').slice(0, 4);

function yearSpan(e) {
  const a = String(e.founded).slice(0, 4);
  const b = e.dissolved ? String(e.dissolved).slice(0, 4) : '';
  return b ? a + '–' + b : a + '–今';
}

function card(e, flip) {
  const el = document.createElement('div');
  el.className = 'card eCard' + (flip ? ' right' : '');
  el.innerHTML = `<div class="cHead"><span class="life" style="color:var(--accent)">${yearSpan(e)}</span><span>${TYPES[e.type] || e.type}</span><span class="st ${e.status}">${STATUS[e.status] || e.status}</span></div>
    <h3 class="cTitle"><a>${esc(e.name)}${e.en_name ? `<span class="en" style="font-family:var(--mono);font-size:.72rem;color:var(--faint);margin-left:8px">${esc(e.en_name)}</span>` : ''}</a></h3>
    <div class="hl">${esc(e.headline)}</div>
    <p class="sm">${esc(e.summary_30s.slice(0, 100))}${e.summary_30s.length > 100 ? '…' : ''}</p>
    <div class="meta">${esc(e.hq || '')} · ${e.timeline.length} 个兴衰节点</div>`;
  el.onclick = () => openDetail(e);
  return el;
}

function openDetail(e) {
  const tl = e.timeline.map(t =>
    `<div class="tlItem"><div class="td">${String(t.date).slice(0, t.acc === 'year' ? 4 : t.acc === 'month' ? 7 : 10)}</div><div class="tx">${esc(t.text)}</div></div>`).join('');
  const ms = (e.milestones || []).map(a => `<li>${esc(a)}</li>`).join('');
  const src = e.sources.map(s => `<li><a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('');
  const ctz = (e.controversies || []).length
    ? `<h4>争议记录</h4>${e.controversies.map(c => `<div class="ctzBox">${esc(c)}</div>`).join('')}` : '';
  const rel = (e.related_persons || []).map(r => `<a class="relChip" href="../persons/?p=${r.id}">${esc(r.name)}</a>`).join('');
  $('#detail').innerHTML = `<button class="close">✕</button>
    <h2>${esc(e.name)}${e.en_name ? `<span style="font-family:var(--mono);font-size:.9rem;color:var(--faint)"> ${esc(e.en_name)}</span>` : ''}</h2>
    <div class="sub">${esc(e.headline)} · ${TYPES[e.type] || e.type} · ${REGION[e.region] || ''} · <span class="st ${e.status}">${STATUS[e.status] || e.status}</span> · ${yearSpan(e)}</div>
    <p class="smFull">${esc(e.bio || e.summary_30s)}</p>
    <h4>兴衰历程</h4><div class="tl">${tl}</div>
    <h4>关键数字</h4><ul class="msList">${ms}</ul>
    <h4>现状与遗产</h4><div class="legacyBox">${esc(e.legacy)}</div>${ctz}
    ${rel ? `<h4>相关人物</h4><div class="relRow">${rel}</div>` : ''}
    <h4>来源</h4><ul class="srcList">${src}</ul>`;
  $('#detail').classList.add('show');
  $('#mask').classList.add('show');
  document.body.style.overflow = 'hidden';
  $('#detail').querySelector('.close').onclick = closeDetail;
}
function closeDetail() {
  $('#detail').classList.remove('show');
  $('#mask').classList.remove('show');
  document.body.style.overflow = '';
}
$('#mask').onclick = closeDetail;
addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

function visible(e) {
  if (curFilter !== 'all' && e.type !== curFilter) return false;
  const q = curQuery.trim().toLowerCase();
  if (q) {
    const hay = (e.name + (e.en_name || '') + e.headline + (e.hq || '') + (e.tags || []).join('')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function render() {
  const root = $('#etimeline');
  root.innerHTML = '';
  let shown = 0;
  ERAS.forEach((era, ei) => {
    const list = DATA.entities.filter(e => eraIdx(+byY(e) || 0) === ei && visible(e))
      .sort((a, b) => byY(a).localeCompare(byY(b)));
    if (!list.length) return;
    const sec = document.createElement('section');
    sec.className = 'eraSec';
    const ys = list.map(e => +byY(e));
    sec.innerHTML = `<div class="eraHead"><span class="eraPill">${era.name}<em>${Math.min(...ys)}–${Math.max(...ys)}</em></span><span class="eraLine"></span><span class="eraCount">${list.length} 家</span></div><div class="eraBody"></div>`;
    const body = sec.querySelector('.eraBody');
    const byYear = new Map();
    for (const e of list) {
      const y = byY(e);
      if (!byYear.has(y)) byYear.set(y, []);
      byYear.get(y).push(e);
    }
    let flip = ei % 2;
    for (const [year, es] of byYear) {
      const g = document.createElement('div');
      g.className = 'yearGroup';
      g.innerHTML = `<div class="yBadge"><span>${year}</span></div><div class="cards"></div>`;
      const cards = g.querySelector('.cards');
      for (const e of es) {
        cards.appendChild(card(e, flip));
        flip = 1 - flip;
        shown++;
      }
      body.appendChild(g);
    }
    root.appendChild(sec);
  });
  if (!shown) root.innerHTML = '<div class="empty">没有匹配的世家——换个关键词试试</div>';
}

(async () => {
  try {
    DATA = await fetchGz('data.json');
    const bar = $('#typeChips');
    const present = [...new Set(DATA.entities.map(e => e.type))];
    for (const f of present) {
      const n = DATA.entities.filter(e => e.type === f).length;
      const b = document.createElement('button');
      b.className = 'chip'; b.dataset.f = f;
      b.textContent = `${TYPES[f] || f} ${n}`;
      b.onclick = () => {
        curFilter = f;
        bar.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.f === f));
        $('#allBtn').classList.toggle('on', curFilter === 'all');
        render();
      };
      bar.appendChild(b);
    }
    $('#allBtn').onclick = () => {
      curFilter = 'all';
      document.querySelectorAll('.eBar .chip').forEach(x => x.classList.toggle('on', x.dataset.f === 'all' || x.id === 'allBtn'));
      render();
    };
    let qt;
    $('#q').addEventListener('input', e => {
      clearTimeout(qt);
      qt = setTimeout(() => { curQuery = e.target.value; render(); }, 160);
    });
    $('#heroSub').textContent = `共 ${DATA.entities.length} 家世家——企业、社区、机构的完整兴衰史，从创立到巅峰到谢幕，每个节点精确可溯源。按创立年代纵览，点击卡片展开完整兴衰时间线。`;
    render();
    const want = new URLSearchParams(location.search).get('e');
    if (want) {
      const ent = DATA.entities.find(x => x.id === want);
      if (ent) openDetail(ent);
    }
  } catch (e) {
    $('#etimeline').innerHTML = `<div class="empty">数据加载失败（${esc(e.message)}）</div>`;
  }
})();
</script>
</body>
</html>
