<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="世家志：企业、社区、机构的完整兴衰史——从创立到巅峰到谢幕，节点全部可溯源。对应《史记》五体中的「世家」。">
<link rel="canonical" href="https://toolsfox.cn/entities/">
<meta property="og:type" content="website">
<meta property="og:title" content="世家志 · 企业社区机构兴衰史 — 互联网编年史">
<meta property="og:description" content="腾讯的天涯的猫扑的，你们的青春都在这里立了传——企业、社区、机构的完整兴衰史，从创立到巅峰到谢幕。">
<meta property="og:url" content="https://toolsfox.cn/entities/">
<meta property="og:image" content="https://toolsfox.cn/assets/og-card.png">
<meta name="twitter:card" content="summary_large_image">
<title>世家志 · 企业社区机构兴衰史</title>
<link rel="stylesheet" href="../style.css?v=20">
<script>
(function () {
  var t = localStorage.getItem('na-theme');
  if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
.entitiesPage{max-width:1160px;margin:0 auto;padding:0 28px 80px}
.eTop{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.eTop a{color:var(--dim);text-decoration:none;font-size:.86rem}
.eTop a:hover{color:var(--text)}
.eHero{padding:30px 0 26px;border-bottom:1px solid var(--line)}
.eHero h1{font-family:var(--serif);font-weight:700;font-size:clamp(2rem,5vw,3.2rem);margin:0 0 12px;color:var(--text)}
.eHero h1 em{font-style:normal;color:var(--accent)}
.eHero p{color:var(--dim);max-width:640px;margin:0;line-height:1.8}
.eBar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.eBar .chip{font-family:var(--mono);font-size:.78rem;padding:7px 14px;border:1px solid var(--line2);border-radius:20px;background:none;color:var(--dim);cursor:pointer}
.eBar .chip.on{border-color:var(--accent);color:var(--accent)}
#q{margin-left:auto;font-family:var(--mono);font-size:.78rem;padding:7px 14px;border:1px solid var(--line2);border-radius:20px;background:none;color:var(--text);outline:none;min-width:180px}
.tlList{margin:2px 0 0;padding:0;list-style:none}
.tlList li{position:relative;padding:0 0 10px 18px;line-height:1.7}
.tlList li::before{content:'';position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tlList .td{font-family:var(--mono);font-size:.7rem;color:var(--accent);margin-right:8px}
.tlList .tx{color:var(--text);font-size:.87rem}
.ctzBox{border-left:3px solid #b8862b;padding:8px 14px;background:var(--panel);border-radius:0 8px 8px 0;color:var(--dim);line-height:1.7;font-size:.86rem;margin:0 0 8px}
.legacyBox{border-left:3px solid var(--accent);padding:10px 14px;background:var(--panel);border-radius:0 8px 8px 0;color:var(--text);line-height:1.8;font-size:.88rem}
.relRow{display:flex;gap:8px;flex-wrap:wrap}
.relChip{font-family:var(--mono);font-size:.74rem;padding:4px 12px;border:1px solid var(--line2);border-radius:16px;color:var(--accent);text-decoration:none}
.relChip:hover{border-color:var(--accent);background:var(--panel)}
.srcList{margin:4px 0 0;padding-left:18px;font-size:.83rem;line-height:2}
.srcList a{color:var(--accent);text-decoration:none}
.srcList a:hover{text-decoration:underline}
.empty{grid-column:1/-1;text-align:center;color:var(--faint);font-family:var(--mono);font-size:.8rem;padding:30px}
@media (max-width:640px){#q{min-width:140px}}
</style>
</head>
<body>
<div class="entitiesPage">
  <div class="eTop"><a href="../">← 返回互联网编年史</a><span><a href="../works/">作品志 →</a>&nbsp;&nbsp;<a href="../today/">今天 →</a></span></div>
  <div class="eHero">
    <h1>世家<em>志</em></h1>
    <p id="heroSub">企业、社区、机构的完整兴衰史，从创立到巅峰到谢幕，每个节点精确可溯源。</p>
  </div>
  <div class="eBar">
    <button class="chip on" data-f="all" id="allBtn">全部</button>
    <span id="typeChips" style="display:contents"></span>
    <input id="q" placeholder="搜索世家 / 总部…" autocomplete="off">
  </div>
  <div id="etimeline" class="timeline"></div>
</div>

<script>
'use strict';
const TYPES = {company:'企业', community:'社区', media:'媒体', service:'服务', infrastructure:'基础设施', organization:'机构', institution:'机构', game:'游戏'};
const TCOLOR = {company:'#3aa891', community:'#5b9bd5', media:'#c9a86a', service:'#c96a93', infrastructure:'#7ba05b', organization:'#8a919e', game:'#8b6fc9'};
const STATUS = {active:'活跃', declined:'衰落', acquired:'被收购', privatized:'已退市', closed:'关停'};
const SCONF = {active:'v', declined:'s', closed:'u'};
const REGION = {cn:'中国', world:'世界'};
const ERAS = [
  { name: '奠基纪元', range: [-Infinity, 1990] },
  { name: '拨号纪元', range: [1990, 1999] },
  { name: '门户纪元', range: [1999, 2005] },
  { name: 'Web2.0 纪元', range: [2005, 2011] },
  { name: '移动纪元', range: [2011, 2016] },
  { name: '智能纪元', range: [2016, Infinity] },
];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
let DATA = null, curFilter = 'all', curQuery = '';
const DATA_BUILD = '20261025a';

async function fetchGz(url) {
  if (typeof DecompressionStream !== 'undefined') {
    try {
      const r = await fetch(url + '.gz?v=' + DATA_BUILD);
      if (r.ok) return await new Response((await r.blob()).stream().pipeThrough(new DecompressionStream('gzip'))).json();
    } catch (e) { /* 回退 */ }
  }
  return await (await fetch(url + '?v=' + DATA_BUILD)).json();
}

const eraIdx = y => ERAS.findIndex(e => y >= e.range[0] && y < e.range[1]);
const byY = e => String(e.founded || '0000').slice(0, 4);
const dsh = t => String(t.date).slice(0, t.acc === 'year' ? 4 : t.acc === 'month' ? 7 : 10);

function card(e) {
  const el = document.createElement('div');
  el.className = 'card in';
  el.dataset.id = e.id;
  const span = e.dissolved ? `${String(e.founded).slice(0, 4)}–${String(e.dissolved).slice(0, 4)}` : `${String(e.founded).slice(0, 4)}–今`;
  const st = `<span class="cConf ${SCONF[e.status] || ''}">${STATUS[e.status] || e.status}</span>`;
  const tl = e.timeline.map(t =>
    `<li><span class="td">${dsh(t)}</span><span class="tx">${esc(t.text)}</span></li>`).join('');
  const ms = (e.milestones || []).map(a => `· ${esc(a)}`).join('<br>');
  const ctzs = (e.controversies || []).length
    ? `<div class="sec"><span class="lab">争议记录</span>${e.controversies.map(c => `<div class="ctzBox">${esc(c)}</div>`).join('')}</div>` : '';
  const src = e.sources.map(s => `<li><a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('');
  const rel = (e.related_persons || []).length
    ? `<div class="sec"><span class="lab">相关人物</span><div class="relRow">${e.related_persons.map(r => `<a class="relChip" href="../persons/?p=${r.id}">${esc(r.name)}</a>`).join('')}</div></div>` : '';
  el.innerHTML = `
    <div class="cHead">
      <span class="cDate">${span}</span>
      <span class="cDot" style="--c:${TCOLOR[e.type] || '#8a919e'}"></span><span>${TYPES[e.type] || e.type}</span>
      ${st}
      <span class="cAcc">${REGION[e.region] || ''}</span>
    </div>
    <h3 class="cTitle"><a>${esc(e.name)}${e.en_name ? ` <span class="arrow" style="font-family:var(--mono);font-size:.72rem;color:var(--faint)">${esc(e.en_name)}</span>` : ''}</a></h3>
    <p class="cSum">${esc(e.headline)}。${esc(e.summary_30s.slice(0, 90))}${e.summary_30s.length > 90 ? '…' : ''}</p>
    <button class="cMore">展开兴衰历程 <i>∨</i></button>
    <div class="cBody"><div class="cBodyInner">
      <div class="sec"><span class="lab">兴衰概述</span><p>${esc(e.bio || e.summary_30s)}</p></div>
      <div class="sec"><span class="lab">兴衰历程</span><ul class="tlList">${tl}</ul></div>
      ${ms ? `<div class="sec"><span class="lab">关键数字</span><p>${ms}</p></div>` : ''}
      <div class="sec"><span class="lab">现状与遗产</span><div class="legacyBox">${esc(e.legacy)}</div></div>${ctzs}${rel}
      <div class="sec"><span class="lab">来源</span><ul class="srcList">${src}</ul></div>
    </div></div>`;
  return el;
}

$('#etimeline').addEventListener('click', ev => {
  const more = ev.target.closest('.cMore');
  if (more) { more.closest('.card').classList.toggle('open'); return; }
  const cardEl = ev.target.closest('.card');
  if (cardEl && !ev.target.closest('a')) cardEl.classList.add('open');
});

function visible(e) {
  if (curFilter !== 'all' && e.type !== curFilter) return false;
  const q = curQuery.trim().toLowerCase();
  if (q) {
    const hay = (e.name + (e.en_name || '') + e.headline + (e.hq || '') + (e.tags || []).join('')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function render() {
  const root = $('#etimeline');
  root.innerHTML = '';
  let shown = 0;
  ERAS.forEach((era, ei) => {
    const list = DATA.entities.filter(e => eraIdx(+byY(e) || 0) === ei && visible(e))
      .sort((a, b) => byY(a).localeCompare(byY(b)));
    if (!list.length) return;
    const sec = document.createElement('section');
    sec.className = 'eraSec';
    const ys = list.map(e => +byY(e));
    sec.innerHTML = `<div class="eraHead"><span class="eraPill">${era.name}<em>${Math.min(...ys)}–${Math.max(...ys)}</em></span><span class="eraLine"></span><span class="eraCount">${list.length} 家</span></div><div class="eraBody"></div>`;
    const body = sec.querySelector('.eraBody');
    const byYear = new Map();
    for (const e of list) {
      const y = byY(e);
      if (!byYear.has(y)) byYear.set(y, []);
      byYear.get(y).push(e);
    }
    let flip = ei % 2;
    for (const [year, es] of byYear) {
      const g = document.createElement('div');
      g.className = 'yearGroup';
      g.innerHTML = `<div class="yBadge"><span>${year}</span>${es.length > 1 ? `<small>${es.length}</small>` : ''}</div><div class="cards"></div>`;
      const cards = g.querySelector('.cards');
      for (const e of es) {
        const c = card(e);
        if (flip) c.classList.add('right');
        cards.appendChild(c);
        flip = 1 - flip;
        shown++;
      }
      body.appendChild(g);
    }
    root.appendChild(sec);
  });
  if (!shown) root.innerHTML = '<div class="empty">没有匹配的世家——换个关键词试试</div>';
}

(async () => {
  try {
    DATA = await fetchGz('data.json');
    const bar = $('#typeChips');
    const present = [...new Set(DATA.entities.map(e => e.type))];
    for (const f of present) {
      const n = DATA.entities.filter(e => e.type === f).length;
      const b = document.createElement('button');
      b.className = 'chip'; b.dataset.f = f;
      b.innerHTML = `<span style="color:${TCOLOR[f] || '#8a919e'}">●</span> ${TYPES[f] || f}<span class="n">${n}</span>`;
      b.onclick = () => {
        curFilter = f;
        bar.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.f === f));
        $('#allBtn').classList.toggle('on', curFilter === 'all');
        render();
      };
      bar.appendChild(b);
    }
    $('#allBtn').onclick = () => {
      curFilter = 'all';
      document.querySelectorAll('.eBar .chip').forEach(x => x.classList.toggle('on', x.dataset.f === 'all' || x.id === 'allBtn'));
      render();
    };
    let qt;
    $('#q').addEventListener('input', e => {
      clearTimeout(qt);
      qt = setTimeout(() => { curQuery = e.target.value; render(); }, 160);
    });
    $('#heroSub').textContent = `共 ${DATA.entities.length} 家世家——企业、社区、机构的完整兴衰史，从创立到巅峰到谢幕，每个节点精确可溯源。按创立年代纵览，点击卡片展开完整兴衰史。`;
    render();
    const want = new URLSearchParams(location.search).get('e');
    if (want) {
      const c = document.querySelector(`.card[data-id="${want}"]`);
      if (c) {
        c.classList.add('open');
        c.scrollIntoView({ block: 'center', behavior: 'instant' });
        c.style.outline = '2px solid var(--accent)';
        setTimeout(() => { c.style.outline = ''; }, 2600);
      }
    }
  } catch (e) {
    $('#etimeline').innerHTML = `<div class="empty">数据加载失败（${esc(e.message)}）</div>`;
  }
})();
</script>
</body>
</html>
