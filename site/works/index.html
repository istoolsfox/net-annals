<script>
(function () {
  var t = localStorage.getItem('na-theme');
  if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
.worksPage{max-width:1160px;margin:0 auto;padding:0 28px 80px}
.wTop{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;margin:0 -28px;padding:12px 28px;background:var(--bg);border-bottom:1px solid var(--line)}
.wTop a{color:var(--dim);text-decoration:none;font-size:.86rem}
.wTop a:hover{color:var(--text)}
.wHero{padding:30px 0 26px;border-bottom:1px solid var(--line)}
.wHero h1{font-family:var(--serif);font-weight:700;font-size:clamp(2rem,5vw,3.2rem);margin:0 0 12px;color:var(--text)}
.wHero h1 em{font-style:normal;color:var(--accent)}
.wHero p{color:var(--dim);max-width:640px;margin:0;line-height:1.8}
.wBar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.wBar .chip{font-family:var(--mono);font-size:.78rem;padding:7px 14px;border:1px solid var(--line2);border-radius:20px;background:none;color:var(--dim);cursor:pointer}
.wBar .chip.on{border-color:var(--accent);color:var(--accent)}
#wq{margin-left:auto;font-family:var(--mono);font-size:.78rem;padding:7px 14px;border:1px solid var(--line2);border-radius:20px;background:none;color:var(--text);outline:none;min-width:180px}
.tlList{margin:2px 0 0;padding:0;list-style:none}
.tlList li{position:relative;padding:0 0 10px 18px;line-height:1.7}
.tlList li::before{content:'';position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tlList .td{font-family:var(--mono);font-size:.7rem;color:var(--accent);margin-right:8px}
.tlList .tx{color:var(--text);font-size:.87rem}
.quoteBox{border-left:3px solid var(--accent);padding:8px 14px;background:var(--panel);border-radius:0 8px 8px 0;color:var(--text);line-height:1.8;font-size:.9rem;margin:0 0 8px;font-family:var(--serif)}
.legacyBox{border-left:3px solid var(--accent);padding:10px 14px;background:var(--panel);border-radius:0 8px 8px 0;color:var(--text);line-height:1.8;font-size:.88rem}
.srcList{margin:4px 0 0;padding-left:18px;font-size:.83rem;line-height:2}
.srcList a{color:var(--accent);text-decoration:none}
.srcList a:hover{text-decoration:underline}
.empty{grid-column:1/-1;text-align:center;color:var(--faint);font-family:var(--mono);font-size:.8rem;padding:30px}
@media (max-width:640px){#wq{min-width:140px}}
</style>
</head>
<body>
<div class="worksPage">
  <div class="wTop"><a href="../">← 返回互联网编年史</a><span><a href="../today/">今天 →</a>&nbsp;&nbsp;<a href="../geo/">地域日志 →</a></span></div>
  <div class="wHero">
    <h1>作品<em>志</em></h1>
    <p id="heroSub">影视、文学、音乐、游戏——那些陪伴大众精神生活的创作物。它们的诞生、反响与经典化，全部可溯源。</p>
  </div>
  <div class="wBar">
    <span id="typeChips" style="display:contents"></span>
    <input id="wq" placeholder="搜索作品 / 主创…" autocomplete="off">
  </div>
  <div id="wtimeline" class="timeline"></div>
</div>

<script>window.NA_PAGE_KIND='works';</script>

</body>
