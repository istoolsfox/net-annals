<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="作品志：影视、文学、音乐、游戏——陪伴中文互联网一代人的创作物，它们的诞生、反响与精神遗产。">
<link rel="canonical" href="https://toolsfox.cn/works/">
<meta property="og:type" content="website">
<meta property="og:title" content="作品志 · 影视文学音乐游戏 — 互联网编年史">
<meta property="og:description" content="那些陪伴大众精神生活的创作物——它们的诞生、反响与经典化，全部可溯源。">
<meta property="og:url" content="https://toolsfox.cn/works/">
<meta property="og:image" content="https://toolsfox.cn/assets/og-card.png">
<meta name="twitter:card" content="summary_large_image">
<title>作品志 · 影视文学音乐游戏 — 互联网编年史</title>
<link rel="stylesheet" href="../style.css?v=21">
<script>
(function () {
  var t = localStorage.getItem('na-theme');
  if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
.worksPage{max-width:1160px;margin:0 auto;padding:0 28px 80px}
.wTop{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.wTop a{color:var(--dim);text-decoration:none;font-size:.86rem}
.wTop a:hover{color:var(--text)}
.wHero{padding:30px 0 26px;border-bottom:1px solid var(--line)}
.wHero h1{font-family:var(--serif);font-weight:700;font-size:clamp(2rem,5vw,3.2rem);margin:0 0 12px;color:var(--text)}
.wHero h1 em{font-style:normal;color:var(--accent)}
.wHero p{color:var(--dim);max-width:640px;margin:0;line-height:1.8}
.wBar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.wBar .chip{font-family:var(--mono);font-size:.78rem;padding:7px 14px;border:1px solid var(--line2);border-radius:20px;background:none;color:var(--dim);cursor:pointer}
.wBar .chip.on{border-color:var(--accent);color:var(--accent)}
#wq{margin-left:auto;font-family:var(--mono);font-size:.78rem;padding:7px 14px;border:1px solid var(--line2);border-radius:20px;background:none;color:var(--text);outline:none;min-width:180px}
.tlList{margin:2px 0 0;padding:0;list-style:none}
.tlList li{position:relative;padding:0 0 10px 18px;line-height:1.7}
.tlList li::before{content:'';position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tlList .td{font-family:var(--mono);font-size:.7rem;color:var(--accent);margin-right:8px}
.tlList .tx{color:var(--text);font-size:.87rem}
.quoteBox{border-left:3px solid var(--accent);padding:8px 14px;background:var(--panel);border-radius:0 8px 8px 0;color:var(--text);line-height:1.8;font-size:.9rem;margin:0 0 8px;font-family:var(--serif)}
.legacyBox{border-left:3px solid var(--accent);padding:10px 14px;background:var(--panel);border-radius:0 8px 8px 0;color:var(--text);line-height:1.8;font-size:.88rem}
.srcList{margin:4px 0 0;padding-left:18px;font-size:.83rem;line-height:2}
.srcList a{color:var(--accent);text-decoration:none}
.srcList a:hover{text-decoration:underline}
.empty{grid-column:1/-1;text-align:center;color:var(--faint);font-family:var(--mono);font-size:.8rem;padding:30px}
@media (max-width:640px){#wq{min-width:140px}}
</style>
</head>
<body>
<div class="worksPage">
  <div class="wTop"><a href="../">← 返回互联网编年史</a><span><a href="../today/">今天 →</a>&nbsp;&nbsp;<a href="../geo/">地域日志 →</a></span></div>
  <div class="wHero">
    <h1>作品<em>志</em></h1>
    <p id="heroSub">影视、文学、音乐、游戏——那些陪伴大众精神生活的创作物。它们的诞生、反响与经典化，全部可溯源。</p>
  </div>
  <div class="wBar">
    <button class="chip on" data-f="all" id="allBtn">全部</button>
    <span id="typeChips" style="display:contents"></span>
    <input id="wq" placeholder="搜索作品 / 主创…" autocomplete="off">
  </div>
  <div id="wtimeline" class="timeline"></div>
</div>

<script>
'use strict';
const TYPES = {film:'电影', tv:'剧集', book:'图书', netnovel:'网络文学', music:'音乐', game:'游戏', comic:'动画漫画', documentary:'纪录片', variety:'综艺'};
const TCOLOR = {film:'#c9584f', tv:'#c96a93', book:'#3aa891', netnovel:'#5b9bd5', music:'#c9a86a', game:'#8b6fc9', comic:'#d08a4e', documentary:'#7ba05b', variety:'#c9b458'};
const ERAS = [
  { name: '纸质与胶片时代', range: [-Infinity, 1994] },
  { name: '拨号时代', range: [1994, 2000] },
  { name: '门户与光碟时代', range: [2000, 2005] },
  { name: 'Web2.0 时代', range: [2005, 2011] },
  { name: '移动与流媒体时代', range: [2011, 2017] },
  { name: '算法与国创时代', range: [2017, Infinity] },
];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u)) ? u : '#';
const $ = s => document.querySelector(s);
let DATA = null, curFilter = 'all', curQuery = '';
const DATA_BUILD = '20261025a';

async function fetchGz(url) {
  if (typeof DecompressionStream !== 'undefined') {
    try {
      const r = await fetch(url + '.gz?v=' + DATA_BUILD);
      if (r.ok) return await new Response((await r.blob()).stream().pipeThrough(new DecompressionStream('gzip'))).json();
    } catch (e) { /* 回退 */ }
  }
  return await (await fetch(url + '?v=' + DATA_BUILD)).json();
}

const eraIdx = y => ERAS.findIndex(e => y >= e.range[0] && y < e.range[1]);
const byY = w => String(w.released || '0000').slice(0, 4);
const dsh = t => String(t.date).slice(0, t.acc === 'year' ? 4 : t.acc === 'month' ? 7 : 10);

function card(w) {
  const el = document.createElement('div');
  el.className = 'card in';
  el.dataset.id = w.id;
  const tl = w.timeline.map(t =>
    `<li><span class="td">${dsh(t)}</span><span class="tx">${esc(t.text)}</span></li>`).join('');
  const quotes = (w.quotes || []).length
    ? `<div class="sec"><span class="lab">经典回响</span>${w.quotes.map(q => `<div class="quoteBox">${esc(q)}</div>`).join('')}</div>` : '';
  const src = w.sources.map(s => `<li><a href="${safeUrl(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('');
  el.innerHTML = `
    <div class="cHead">
      <span class="cDate">${byY(w)}</span>
      <span class="cDot" style="--c:${TCOLOR[w.type] || '#8a919e'}"></span><span>${TYPES[w.type] || w.type}</span>
      <span class="cAcc">${esc((w.creators || '').slice(0, 18))}</span>
    </div>
    <h3 class="cTitle"><a>${esc(w.title)}${w.en_title ? ` <span class="arrow" style="font-family:var(--mono);font-size:.72rem;color:var(--faint)">${esc(w.en_title)}</span>` : ''}</a></h3>
    <p class="cSum">${esc(w.headline)}。${esc(w.summary_30s.slice(0, 90))}${w.summary_30s.length > 90 ? '…' : ''}</p>
    <button class="cMore">展开作品生命线 <i>∨</i></button>
    <div class="cBody"><div class="cBodyInner">
      <div class="sec"><span class="lab">作品小传</span><p>${esc(w.bio || w.summary_30s)}</p></div>
      <div class="sec"><span class="lab">生命线</span><ul class="tlList">${tl}</ul></div>
      ${quotes}
      <div class="sec"><span class="lab">精神遗产</span><div class="legacyBox">${esc(w.legacy)}</div></div>
      <div class="sec"><span class="lab">来源</span><ul class="srcList">${src}</ul></div>
    </div></div>`;
  return el;
}

$('#wtimeline').addEventListener('click', ev => {
  const more = ev.target.closest('.cMore');
  if (more) { more.closest('.card').classList.toggle('open'); return; }
  const cardEl = ev.target.closest('.card');
  if (cardEl && !ev.target.closest('a')) cardEl.classList.add('open');
});

function visible(w) {
  if (curFilter !== 'all' && w.type !== curFilter) return false;
  const q = curQuery.trim().toLowerCase();
  if (q) {
    const hay = (w.title + (w.en_title || '') + (w.creators || '') + w.headline + (w.tags || []).join('')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function render() {
  const root = $('#wtimeline');
  root.innerHTML = '';
  let shown = 0;
  ERAS.forEach((era, ei) => {
    const list = DATA.works.filter(w => eraIdx(+byY(w) || 0) === ei && visible(w))
      .sort((a, b) => byY(a).localeCompare(byY(b)));
    if (!list.length) return;
    const sec = document.createElement('section');
    sec.className = 'eraSec';
    const ys = list.map(w => +byY(w));
    sec.innerHTML = `<div class="eraHead"><span class="eraPill">${era.name}<em>${Math.min(...ys)}–${Math.max(...ys)}</em></span><span class="eraLine"></span><span class="eraCount">${list.length} 部</span></div><div class="eraBody"></div>`;
    const body = sec.querySelector('.eraBody');
    const byYear = new Map();
    for (const w of list) {
      const y = byY(w);
      if (!byYear.has(y)) byYear.set(y, []);
      byYear.get(y).push(w);
    }
    let flip = ei % 2;
    for (const [year, ws] of byYear) {
      const g = document.createElement('div');
      g.className = 'yearGroup';
      g.innerHTML = `<div class="yBadge"><span>${year}</span>${ws.length > 1 ? `<small>${ws.length}</small>` : ''}</div><div class="cards"></div>`;
      const cards = g.querySelector('.cards');
      for (const w of ws) {
        const c = card(w);
        if (flip) c.classList.add('right');
        cards.appendChild(c);
        flip = 1 - flip;
        shown++;
      }
      body.appendChild(g);
    }
    root.appendChild(sec);
  });
  if (!shown) root.innerHTML = '<div class="empty">没有匹配的作品——换个关键词试试</div>';
}

(async () => {
  try {
    DATA = await fetchGz('data.json');
    const bar = $('#typeChips');
    const present = [...new Set(DATA.works.map(w => w.type))];
    for (const f of present) {
      const n = DATA.works.filter(w => w.type === f).length;
      const b = document.createElement('button');
      b.className = 'chip'; b.dataset.f = f;
      b.innerHTML = `<span style="color:${TCOLOR[f] || '#8a919e'}">●</span> ${TYPES[f] || f}<span class="n">${n}</span>`;
      b.onclick = () => {
        curFilter = f;
        bar.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.f === f));
        $('#allBtn').classList.toggle('on', curFilter === 'all');
        render();
      };
      bar.appendChild(b);
    }
    $('#allBtn').onclick = () => {
      curFilter = 'all';
      document.querySelectorAll('.wBar .chip').forEach(x => x.classList.toggle('on', x.dataset.f === 'all' || x.id === 'allBtn'));
      render();
    };
    let qt;
    $('#wq').addEventListener('input', e => {
      clearTimeout(qt);
      qt = setTimeout(() => { curQuery = e.target.value; render(); }, 160);
    });
    $('#heroSub').textContent = `${DATA.works.length} 部作品已收录——影视、文学、音乐、游戏与动画综艺，按发布年代纵览，点击卡片展开完整作品生命线。`;
    render();
    const want = new URLSearchParams(location.search).get('w');
    if (want) {
      const c = document.querySelector(`.card[data-id="${want}"]`);
      if (c) {
        c.classList.add('open');
        c.scrollIntoView({ block: 'center', behavior: 'instant' });
        c.style.outline = '2px solid var(--accent)';
        setTimeout(() => { c.style.outline = ''; }, 2600);
      }
    }
  } catch (e) {
    $('#wtimeline').innerHTML = `<div class="empty">数据加载失败（${esc(e.message)}）</div>`;
  }
})();
</script>
</body>
</html>
