<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="人物志：AI、科技、互联网、商业、游戏电竞与赛博文化圈的知名人士人生历程，全部来自公开可查证来源。">
<title>人物志 · 知名人士人生历程</title>
<link rel="stylesheet" href="../style.css?v=16">
<script>
(function () {
  var t = localStorage.getItem('na-theme');
  if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
.personsPage{max-width:1080px;margin:0 auto;padding:0 24px 80px}
.pTop{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.pTop a{color:var(--dim);text-decoration:none;font-size:.86rem}
.pTop a:hover{color:var(--text)}
.pHero{padding:30px 0 26px;border-bottom:1px solid var(--line)}
.pHero h1{font-family:var(--serif);font-weight:700;font-size:clamp(2rem,5vw,3.2rem);margin:0 0 12px;color:var(--text)}
.pHero h1 em{font-style:normal;color:var(--accent)}
.pHero p{color:var(--dim);max-width:640px;margin:0;line-height:1.8}
.pBar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.pBar .chip{font-family:var(--mono);font-size:.78rem;padding:7px 14px;border:1px solid var(--line2);border-radius:20px;background:none;color:var(--dim);cursor:pointer}
.pBar .chip.on{border-color:var(--accent);color:var(--accent)}
.pGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;padding:24px 0}
.pCard{border:1px solid var(--line);border-radius:10px;padding:18px 20px;background:var(--panel);cursor:pointer;transition:border-color .2s}
.pCard:hover{border-color:var(--accent)}
.pCard h3{margin:0 0 4px;font-size:1.1rem;color:var(--text);font-family:var(--serif)}
.pCard .en{font-family:var(--mono);font-size:.72rem;color:var(--faint);margin-left:8px}
.pCard .hl{color:var(--accent);font-size:.8rem;margin:2px 0 10px}
.pCard .sm{color:var(--dim);font-size:.85rem;line-height:1.7;margin:0}
.pCard .meta{margin-top:12px;font-family:var(--mono);font-size:.7rem;color:var(--faint)}
/* 详情浮层 */
.pMask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none}
.pMask.show{display:block}
.pDetail{position:fixed;top:0;right:-720px;width:min(680px,94vw);height:100vh;overflow-y:auto;
  background:var(--bg2);border-left:1px solid var(--line2);z-index:61;padding:30px 34px 60px;
  transition:right .25s ease}
.pDetail.show{right:0}
.pDetail h2{font-family:var(--serif);font-size:1.7rem;color:var(--text);margin:0 0 4px}
.pDetail .close{position:absolute;top:18px;right:20px;font-size:1.3rem;background:none;border:none;color:var(--dim);cursor:pointer}
.pDetail .close:hover{color:var(--text)}
.pDetail .sub{color:var(--accent);font-size:.85rem;margin-bottom:16px}
.pDetail .smFull{color:var(--text);line-height:1.85;font-size:.94rem}
.pDetail h4{font-family:var(--mono);font-size:.76rem;letter-spacing:.2em;color:var(--dim);margin:28px 0 14px;text-transform:uppercase}
.tl{border-left:2px solid var(--line2);margin-left:6px;padding-left:20px}
.tlItem{position:relative;padding-bottom:18px}
.tlItem::before{content:'';position:absolute;left:-25px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tlItem .td{font-family:var(--mono);font-size:.72rem;color:var(--accent)}
.tlItem .tx{color:var(--text);font-size:.9rem;line-height:1.75;margin-top:2px}
.achList{margin:0;padding-left:18px;color:var(--text);font-size:.9rem;line-height:2}
.srcList{margin:0;padding-left:18px;font-size:.83rem;line-height:2}
.srcList a{color:var(--accent);text-decoration:none}
.srcList a:hover{text-decoration:underline}
@media (max-width:640px){.pDetail{padding:24px 20px 50px}}
</style>
</head>
<body>
<div class="personsPage">
  <div class="pTop"><a href="../">← 返回互联网编年史</a><a href="../geo/">地域日志 →</a></div>
  <div class="pHero">
    <h1>人物<em>志</em></h1>
    <p id="heroSub">AI、科技、互联网、商业、游戏电竞与赛博文化圈的知名人士——人生历程、关键节点与公开成就，逐人核实、全部可溯源。政治与纯敏感人物一律不收录。</p>
  </div>
  <div class="pBar" id="fieldBar"><button class="chip on" data-f="all">全部</button></div>
  <div class="pGrid" id="grid"></div>
</div>
<div class="pMask" id="mask"></div>
<div class="pDetail" id="detail"></div>

<script>
'use strict';
const FIELDS = {ai:'AI', internet:'互联网', hardware:'硬件制造', company:'公司商业', game:'游戏电竞', creator:'创作者', science:'科学', finance:'金融', media:'媒体', sport:'体育'};
const $ = s => document.querySelector(s);
let DATA = null, curFilter = 'all';

async function fetchGz(url) {
  if (typeof DecompressionStream !== 'undefined') {
    try {
      const r = await fetch(url + '.gz');
      if (r.ok) return await new Response((await r.blob()).stream().pipeThrough(new DecompressionStream('gzip'))).json();
    } catch (e) { /* 回退 */ }
  }
  return await (await fetch(url)).json();
}

function card(p) {
  const d = document.createElement('div');
  d.className = 'pCard';
  d.dataset.field = p.field;
  d.innerHTML = `<h3>${p.name}${p.en_name ? `<span class="en">${p.en_name}</span>` : ''}</h3>
    <div class="hl">${p.headline}</div>
    <p class="sm">${p.summary_30s.slice(0, 110)}${p.summary_30s.length > 110 ? '…' : ''}</p>
    <div class="meta">${p.birth.slice(0, 4)}年生 · ${FIELDS[p.field] || p.field} · ${p.timeline.length} 个节点</div>`;
  d.onclick = () => openDetail(p);
  return d;
}

function openDetail(p) {
  const tl = p.timeline.map(t =>
    `<div class="tlItem"><div class="td">${t.date.slice(0, t.acc === 'year' ? 4 : t.acc === 'month' ? 7 : 10)}</div><div class="tx">${t.text}</div></div>`).join('');
  const ach = (p.achievements || []).map(a => `<li>${a}</li>`).join('');
  const src = p.sources.map(s => `<li><a href="${s.url}" target="_blank" rel="noopener">${s.title}</a></li>`).join('');
  const ctz = p.region === 'cn' ? '中国' : '国际';
  const death = p.death ? ` － ${String(p.death).slice(0, 4)}` : '';
  $('#detail').innerHTML = `<button class="close">✕</button>
    <h2>${p.name}</h2>
    <div class="sub">${p.headline} · ${ctz}${death} · ${FIELDS[p.field] || p.field}</div>
    <p class="smFull">${p.summary_30s}</p>
    <h4>人生历程</h4><div class="tl">${tl}</div>
    <h4>关键成就</h4><ul class="achList">${ach}</ul>
    <h4>来源</h4><ul class="srcList">${src}</ul>`;
  $('#detail').classList.add('show');
  $('#mask').classList.add('show');
  document.body.style.overflow = 'hidden';
  $('#detail').querySelector('.close').onclick = closeDetail;
}
function closeDetail() {
  $('#detail').classList.remove('show');
  $('#mask').classList.remove('show');
  document.body.style.overflow = '';
}
$('#mask').onclick = closeDetail;
addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

function render() {
  const grid = $('#grid');
  grid.innerHTML = '';
  for (const p of DATA.persons) {
    if (curFilter !== 'all' && p.field !== curFilter) continue;
    grid.appendChild(card(p));
  }
}

(async () => {
  try {
    DATA = await fetchGz('persons-data.json');
    const bar = $('#fieldBar');
    const present = [...new Set(DATA.persons.map(p => p.field))];
    for (const f of present) {
      const n = DATA.persons.filter(p => p.field === f).length;
      const b = document.createElement('button');
      b.className = 'chip'; b.dataset.f = f;
      b.textContent = `${FIELDS[f] || f} ${n}`;
      b.onclick = () => {
        curFilter = f;
        bar.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.f === f));
        render();
      };
      bar.appendChild(b);
    }
    bar.querySelectorAll('.chip')[0].onclick = () => { curFilter = 'all'; bar.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.f === 'all')); render(); };
    $('#heroSub').textContent = `${DATA.persons.length} 位人物已收录——AI、科技、互联网、商业、游戏电竞与赛博文化圈的知名人士人生历程，逐人核实、全部可溯源。政治与纯敏感人物一律不收录。`;
    render();
  } catch (e) {
    $('#grid').innerHTML = `<div class="pCard">数据加载失败（${e.message}）</div>`;
  }
})();
</script>
</body>
</html>
